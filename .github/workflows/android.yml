name: Android build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'server/**', '.github/workflows/server-e2e.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  XRAY_VERSION: v26.11.9

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;28.2.13676358'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: xray/libxray/go.mod

      # ---- Xray-core for Android (gomobile .aar, built from source) ----
      - name: Cache libxray.aar
        id: aar
        uses: actions/cache@v4
        with:
          path: app/libs/libxray.aar
          key: libxray-${{ env.XRAY_VERSION }}-${{ hashFiles('xray/libxray/*.go', 'xray/libxray/build.sh') }}

      - name: Build libxray.aar (Xray-core ${{ env.XRAY_VERSION }})
        if: steps.aar.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./xray/libxray/build.sh

      # ---- stable signing key (kept in the Actions cache, never committed) ----
      - name: Restore signing key
        id: ks
        uses: actions/cache@v4
        with:
          path: ~/.shield-keystore
          key: shield-signing-v1
      - name: Create signing key
        if: steps.ks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.shield-keystore
          keytool -genkeypair -v -keystore ~/.shield-keystore/release.jks -storepass shieldci -keypass shieldci \
            -alias shield -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Smart Ad Shield VPN"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Unit tests
        run: gradle :app:testReleaseUnitTest --stacktrace --no-daemon

      - name: Assemble release APK
        run: |
          export SHIELD_KEYSTORE="$HOME/.shield-keystore/release.jks"
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Collect APK
        id: apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SmartAdShieldVPN.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs out/SmartAdShieldVPN.apk | head -3
          unzip -l out/SmartAdShieldVPN.apk | grep -E 'libwg-go|libgojni' || (echo "native VPN engines missing from APK" && exit 1)
          sha256sum out/SmartAdShieldVPN.apk | tee out/SmartAdShieldVPN.apk.sha256
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: SmartAdShieldVPN-apk
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "APK build ${{ github.run_number }} (${{ steps.apk.outputs.short }})"
          make_latest: true
          body: |
            Built by GitHub Actions from ${{ github.sha }}.
            Status: build + unit tests passed. **NOT DEVICE TESTED.** A successful build does not prove a VPN connection.
          files: |
            out/SmartAdShieldVPN.apk
            out/SmartAdShieldVPN.apk.sha256

  # Runs the APK's real tunnel code on an Android emulator against a real
  # gateway installed on the same runner (emulator reaches it at 10.0.2.2).
  device-e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: Restore libxray.aar
        uses: actions/cache/restore@v4
        with:
          path: app/libs/libxray.aar
          key: libxray-${{ env.XRAY_VERSION }}-${{ hashFiles('xray/libxray/*.go', 'xray/libxray/build.sh') }}
          fail-on-cache-miss: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build app + instrumentation APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Install gateway on runner
        run: |
          set -o pipefail
          RUNNER_IP=$(curl -4 -fsS https://1.1.1.1/cdn-cgi/trace | sed -n 's/^ip=//p')
          TOKEN=$(openssl rand -hex 24)
          sudo SHIELD_TOKEN="$TOKEN" SHIELD_PUBLIC_IP="$RUNNER_IP" SHIELD_ENDPOINT=10.0.2.2 SHIELD_NAME="CI gateway" \
               bash server/install.sh 2>&1 | tail -5
          PIN=$(sudo openssl x509 -in /etc/shieldvpn/api.crt -outform DER | sha256sum | cut -d' ' -f1)
          CODE="SHIELD1:$(jq -nc --arg ip "$RUNNER_IP" --arg tok "$TOKEN" --arg pin "$PIN" \
                 '{v:1, api:"https://10.0.2.2:8443", ip:$ip, tok:$tok, pin:$pin, name:"CI gateway"}' | base64 -w0)"
          echo "::add-mask::$TOKEN"
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          echo "ENROLL_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell appops set com.smartadshield.vpn ACTIVATE_VPN allow
            adb logcat -c
            adb shell am instrument -w -e enrollCode "$ENROLL_CODE" -e expectedExitIp "$RUNNER_IP" com.smartadshield.vpn.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/instr.txt
            adb logcat -d -s RealGatewayTest:I ShieldTunnel:I WireGuard/GoBackend:* AndroidRuntime:E > /tmp/logcat.txt || true
            grep -E 'RESULT|ShieldTunnel' /tmp/logcat.txt | tail -40
            grep -q '^OK (1 test)' /tmp/instr.txt

      - name: Upload device logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-e2e-logs
          path: |
            /tmp/instr.txt
            /tmp/logcat.txt
          if-no-files-found: ignore
